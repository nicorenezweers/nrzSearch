[package]
name = "nrzsearch"
version = "1.0.1"
edition = "2021"
description = "nrzSearch - eigene Such-Oberflaeche ueber die eigene SearXNG-Instanz"
license = "MIT"

[dependencies]
# Der Webserver
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "fs", "signal"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "compression-br", "set-header"] }
# Die HTTP-Anfragen an SearXNG, Nominatim, Wikidata ...
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "deflate", "rustls-tls", "http2", "stream"] }
serde_json = "1"
# Der Strom fuer die Suche (Server-Sent Events)
futures-util = { version = "0.3", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
# Datum (Wechselkurse, Treffer)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Dateien im Arbeitsbereich: PDF, Word, Excel, PowerPoint, OpenDocument
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Die Ablage je Browser: verschluesselt mit dem Token (AES-256-GCM, HKDF)
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
# Das Admin-Passwort (Argon2id)
argon2 = "0.5"
# Schneller Allocator (viele kleine JSON-Werte)
mimalloc = { version = "0.1", default-features = false }
# Signale an die eingebaute SearXNG-Instanz (sanft beenden)
libc = "0.2"

[workspace]
exclude = ["web"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
